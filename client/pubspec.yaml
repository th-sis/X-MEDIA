name: xmedia_client
description: "X-MEDIA 播放器客户端 — Kodi 风格 10 英尺 TV 界面。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  # [V7 D2] fvp (mdk-sdk) 替代 video_player, 解决 Dolby Vision 色彩问题.
  # pub.dev/packages/fvp, BSD-3, wang-bin/fvp@master.
  # 桌面/移动全平台 + DV 支持, API 兼容 video_player, 2 行代码接入.
  fvp: ^0.38.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/screenshot-01.jpg

