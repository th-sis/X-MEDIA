<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-MEDIA 管理台</title>
<style>
  :root {
    --bg: #0e1016; --card: #161a24; --border: #232a3a;
    --text: #e8ecf4; --muted: #8b93a7; --accent: #6e6cf0;
    --ok: #00e5ff; --err: #ff4d4d; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  h1 .sub { color: var(--muted); font-size: 13px; font-weight: 400; }
  header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .v { color: var(--muted); }
  .kv .v.ok { color: var(--ok); }
  .kv .v.err { color: var(--err); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; margin-right: 8px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .muted { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.active { background: rgba(0,229,255,.12); color: var(--ok); }
  .badge.inactive { background: rgba(255,77,77,.12); color: var(--err); }
  .badge.scanning { background: rgba(110,108,240,.18); color: #9d9bf7; }
  .login-box { max-width: 360px; margin: 60px auto; }
  .login-box input {
    width: 100%; margin: 8px 0; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px;
  }
  #toast {
    position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; display: none;
  }
</style>
</head>
<body>
<header>
  <h1>X-MEDIA 管理台 <span class="sub" id="ver"></span></h1>
  <div>
    <button class="ghost" id="btn-login">登录</button>
    <button class="ghost" id="btn-refresh">刷新</button>
  </div>
</header>

<div id="login-view" style="display:none">
  <div class="card login-box">
    <h2>管理登录</h2>
    <input id="login-user" placeholder="用户名" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btn-do-login" style="width:100%">登录</button>
    <p class="muted" style="margin-top:10px">默认账号 admin / 密码在服务端 data/settings 中</p>
  </div>
</div>

<div id="main-view">
  <div class="grid">
    <div class="card">
      <h2>能力预检（§6.3）</h2>
      <div class="kv"><span>NAS 可用</span><span class="v" id="cap-nas">-</span></div>
      <div class="kv"><span>NAS 索引完成</span><span class="v" id="cap-idx">-</span></div>
      <div class="kv"><span>PanSou 可用</span><span class="v" id="cap-pan">-</span></div>
      <div class="kv"><span>磁力兜底</span><span class="v" id="cap-magnet">-</span></div>
      <div class="kv"><span>已登录网盘</span><span class="v" id="cap-drivers">-</span></div>
      <div class="kv"><span>索引条目总数</span><span class="v" id="snap-indexed">-</span></div>
      <div class="kv"><span>活跃解析任务</span><span class="v" id="snap-active">-</span></div>
    </div>

    <div class="card">
      <h2>NAS 索引引擎（§9）</h2>
      <div id="idx-empty" class="muted" style="margin-bottom:8px">加载中...</div>
      <div id="idx-progress" style="display:none">
        <div class="kv"><span>阶段</span><span class="v" id="idx-phase">-</span></div>
        <div class="kv"><span>状态</span><span class="v" id="idx-status">-</span></div>
        <div class="bar"><div id="idx-bar" style="width:0%"></div></div>
        <div class="kv"><span>进度</span><span class="v" id="idx-count">-</span></div>
        <div class="kv"><span>匹配/待确认/孤儿</span><span class="v" id="idx-match">-</span></div>
      </div>
      <div style="margin-top:12px">
        <button id="btn-scan-full">全量扫描</button>
        <button id="btn-scan-inc" class="ghost">增量扫描</button>
      </div>
    </div>

    <div class="card">
      <h2>账号（网盘）</h2>
      <table>
        <thead><tr><th>名称</th><th>驱动</th><th>状态</th></tr></thead>
        <tbody id="acc-body"><tr><td colspan="3" class="muted">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let authed = false;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2600);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) { authed = false; toast('需要登录后才能执行管理操作'); }
  return res;
}

function boolCell(el, val) {
  el.textContent = val ? '是' : '否';
  el.className = 'v ' + (val ? 'ok' : 'err');
}

async function loadOpen() {
  try {
    const snap = await (await fetch('/api/state/snapshot')).json();
    $('ver').textContent = 'v' + (snap.server_version || '?');
    $('snap-indexed').textContent = snap.indexed_total ?? '-';
    $('snap-active').textContent = snap.active_resolve_tasks ?? '-';
    if (snap.capabilities) renderCaps(snap.capabilities);
    if (snap.index_progress) renderIndex(snap.index_progress);
    else $('idx-empty').textContent = '尚未扫描（配置 nas_local_path 后点全量扫描）';
  } catch (e) { toast('无法读取服务器状态'); }
}

function renderCaps(c) {
  boolCell($('cap-nas'), !!c.nas_available);
  boolCell($('cap-idx'), !!c.nas_index_complete);
  boolCell($('cap-pan'), !!c.pansearch_available);
  boolCell($('cap-magnet'), !!c.magnet_enabled);
  $('cap-drivers').textContent = (c.logged_in_drivers || []).join(', ') || '无';
}

function renderIndex(p) {
  if (!p || !p.total) { $('idx-empty').textContent = '尚未扫描'; return; }
  $('idx-empty').style.display = 'none';
  $('idx-progress').style.display = 'block';
  $('idx-phase').textContent = p.phase || '-';
  $('idx-status').textContent = p.status || '-';
  const pct = p.total ? Math.round(p.processed / p.total * 100) : 0;
  $('idx-bar').style.width = pct + '%';
  $('idx-count').textContent = `${p.processed ?? 0} / ${p.total}（${p.rate_per_sec ?? 0}/s）`;
  $('idx-match').textContent = `${p.matched ?? 0} / ${p.unconfirmed ?? 0} / ${p.orphaned ?? 0}`;
}

async function loadAccounts() {
  try {
    const res = await fetch('/api/admin/accounts');
    if (res.status === 401) { $('acc-body').innerHTML = '<tr><td colspan="3" class="muted">请登录后查看</td></tr>'; return; }
    const data = await res.json();
    const items = data.accounts || data || [];
    const rows = items.map(a => `<tr>
      <td>${a.name || a.driver_type || '-'}</td>
      <td>${a.driver_type || '-'}</td>
      <td><span class="badge ${a.is_active ? 'active' : 'inactive'}">${a.is_active ? '启用' : '停用'}</span></td>
    </tr>`).join('');
    $('acc-body').innerHTML = rows || '<tr><td colspan="3" class="muted">暂无账号</td></tr>';
  } catch (e) { $('acc-body').innerHTML = '<tr><td colspan="3" class="muted">加载失败</td></tr>'; }
}

async function checkAuth() {
  try {
    const res = await fetch('/api/auth/status');
    if (res.ok) {
      const st = await res.json();
      authed = !!(st.authenticated || st.logged_in || st.username);
    }
  } catch (e) { authed = false; }
}

function showLogin() { $('login-view').style.display = 'block'; $('main-view').style.display = 'none'; }
function showMain() { $('login-view').style.display = 'none'; $('main-view').style.display = 'block'; }

async function refreshAll() { await loadOpen(); await loadAccounts(); }

$('btn-login').onclick = () => authed ? toast('已登录') : showLogin();
$('btn-do-login').onclick = async () => {
  const res = await api('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('login-user').value, password: $('login-pass').value }),
  });
  if (res.ok) { authed = true; toast('登录成功'); showMain(); refreshAll(); }
  else { toast('登录失败：' + res.status); }
};
$('btn-refresh').onclick = refreshAll;

$('btn-scan-full').onclick = async () => {
  const btn = $('btn-scan-full'); btn.disabled = true;
  const res = await api('/api/admin/index/nas/full', { method: 'POST' });
  if (res.ok) { toast('全量扫描已启动（WS index_status 推送进度）'); }
  setTimeout(() => { btn.disabled = false; refreshAll(); }, 1500);
};
$('btn-scan-inc').onclick = async () => {
  const btn = $('btn-scan-inc'); btn.disabled = true;
  const res = await api('/api/admin/index/nas/incremental', { method: 'POST' });
  if (res.ok) { toast('增量扫描已启动'); }
  setTimeout(() => { btn.disabled = false; refreshAll(); }, 1500);
};

(async () => {
  await checkAuth();
  if (authed) showMain(); else showMain(); // 概览区无需登录即可查看
  await refreshAll();
  setInterval(async () => { const r = await fetch('/api/state/snapshot'); if (r.ok) { const s = await r.json(); if (s.index_progress) renderIndex(s.index_progress); } }, 3000);
})();
</script>
</body>
</html>
